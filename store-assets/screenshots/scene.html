<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>Airplane Chime Timer Store Screenshots</title>
  <style>
    :root {
      --ink: #143047;
      --muted: #617184;
      --sky: #9adcf5;
      --blue: #2278c8;
      --green: #38a866;
      --line: #dce8ef;
      --paper: #ffffff;
      --warm: #ffd36b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 1280px;
      height: 800px;
      margin: 0;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: #edf8fc;
    }

    .frame {
      width: 1280px;
      height: 800px;
      display: grid;
      grid-template-columns: 474px 1fr;
      gap: 36px;
      padding: 58px 70px;
      background:
        linear-gradient(135deg, rgba(154, 220, 245, 0.95), rgba(236, 248, 250, 0.95)),
        radial-gradient(circle at 86% 18%, rgba(255, 211, 107, 0.5), transparent 280px);
    }

    .copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      margin-bottom: 18px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(20, 48, 71, 0.1);
      font-size: 17px;
      font-weight: 700;
      color: var(--blue);
    }

    h1 {
      margin: 0;
      font-size: 52px;
      line-height: 1.04;
      letter-spacing: 0;
      color: var(--ink);
    }

    .sub {
      margin: 22px 0 28px;
      font-size: 23px;
      line-height: 1.38;
      color: #2f4a5f;
    }

    .points {
      display: grid;
      gap: 12px;
    }

    .point {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 19px;
      color: #243e51;
    }

    .check {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--green);
      color: white;
      font-weight: 800;
    }

    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .browser {
      width: 650px;
      height: 676px;
      border-radius: 18px;
      overflow: hidden;
      background: #f6f9fb;
      border: 1px solid rgba(20, 48, 71, 0.18);
      box-shadow: 0 26px 70px rgba(20, 48, 71, 0.24);
    }

    .bar {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
      background: #233241;
      color: #d9e6ef;
      font-size: 15px;
      font-weight: 600;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ef6a5b;
    }

    .dot:nth-child(2) {
      background: #f3bd4f;
    }

    .dot:nth-child(3) {
      background: #58c96b;
      margin-right: 14px;
    }

    .mock-area {
      height: calc(100% - 52px);
      display: grid;
      place-items: center;
      padding: 28px;
      background: linear-gradient(180deg, #ffffff 0%, #eef5f8 100%);
    }

    .popup {
      width: 350px;
      background: #f8f9fa;
      border-radius: 14px;
      padding: 15px;
      box-shadow: 0 18px 45px rgba(25, 50, 70, 0.22);
      border: 1px solid #dbe6ee;
    }

    .popup h2 {
      margin: 2px 0 12px;
      text-align: center;
      font-size: 20px;
      color: #263f55;
    }

    .card {
      background: white;
      border-radius: 8px;
      padding: 13px;
      margin-bottom: 11px;
      border: 1px solid #edf1f4;
      box-shadow: 0 2px 8px rgba(20, 48, 71, 0.05);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 15px;
    }

    .toggle {
      position: relative;
      width: 48px;
      height: 26px;
      border-radius: 999px;
      background: var(--green);
    }

    .toggle:after {
      content: "";
      position: absolute;
      right: 4px;
      top: 4px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    }

    .next {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #edf1f4;
      text-align: center;
      color: #617184;
      font-size: 14px;
    }

    .next strong {
      color: var(--green);
    }

    .label {
      display: block;
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 700;
      color: #29445b;
    }

    .choice,
    .select,
    .input {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 40px;
      margin-top: 8px;
      padding: 9px 11px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fbfdfe;
      font-size: 14px;
    }

    .radio {
      display: inline-block;
      width: 15px;
      height: 15px;
      margin-right: 9px;
      border: 4px solid #2f80ed;
      border-radius: 50%;
      vertical-align: -2px;
    }

    .mode {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }

    .pill {
      text-align: center;
      padding: 9px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fbfdfe;
      font-size: 13px;
      font-weight: 700;
    }

    .pill.active {
      border-color: var(--green);
      background: #effaf2;
      color: #1f7b47;
    }

    .timer-grid {
      display: grid;
      gap: 10px;
    }

    .timer-box {
      padding: 12px;
      border-left: 4px solid var(--green);
      border-radius: 8px;
      background: #f5fbf6;
    }

    .timer-box strong {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      background: #e9f8ec;
      color: #247343;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
    }

    .upload {
      padding: 10px;
      text-align: center;
      border-radius: 8px;
      background: var(--green);
      color: white;
      font-weight: 800;
      font-size: 14px;
    }

    .slider {
      height: 5px;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--green) 78%, #d9e1e6 78%);
      margin-top: 12px;
      position: relative;
    }

    .slider:after {
      content: "";
      position: absolute;
      left: 78%;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>
  <main id="shot" class="frame"></main>
  <script>
    const shot = new URLSearchParams(location.search).get("shot") || "1";
    const data = {
      "1": {
        eyebrow: "Audio-only reminder",
        title: "Aircraft chimes for focus and breaks",
        sub: "Set a reliable chime every 15 minutes, 30 minutes, hourly, or at an exact time of day.",
        points: ["No popup interruptions", "Badge shows ON/OFF state", "Next chime time is always visible"],
        popup: `
          <h2>Airplane Chime Timer</h2>
          <div class="card">
            <div class="row"><span>Timer Active</span><span class="toggle"></span></div>
            <div class="next">Next chime at: <strong>14:30</strong></div>
          </div>
          <div class="card">
            <span class="label">Chime Sound</span>
            <div class="choice"><span><span class="radio"></span>Double Chime</span></div>
            <div class="choice">Triple Chime</div>
          </div>
          <div class="card">
            <span class="label">Interval or Time</span>
            <div class="select">Every 15 minutes <span>⌄</span></div>
          </div>
          <div class="card">
            <span class="label">Volume</span>
            <div class="slider"></div>
          </div>`
      },
      "2": {
        eyebrow: "Dual timer mode",
        title: "Different sounds for short and long cycles",
        sub: "Use short interval cues for focus and stronger hour marks when timers overlap.",
        points: ["Timer 1 every 15 minutes", "Timer 2 every hour", "Long timer takes priority at overlap"],
        popup: `
          <h2>Airplane Chime Timer</h2>
          <div class="card">
            <div class="row"><span>Timer Active</span><span class="toggle"></span></div>
            <div class="next">Next chime at: <strong>15:00 (Timer 2)</strong></div>
          </div>
          <div class="card">
            <span class="label">Timer Mode</span>
            <div class="mode"><div class="pill">Single Timer</div><div class="pill active">Dual Timer</div></div>
          </div>
          <div class="card timer-grid">
            <div class="timer-box"><strong>Timer 1 · Short Interval</strong><div class="select">Every 15 minutes · Single Chime</div></div>
            <div class="timer-box"><strong>Timer 2 · Long Interval</strong><div class="select">Every hour · Double Chime</div></div>
            <div class="status">Compatible intervals selected</div>
          </div>`
      },
      "3": {
        eyebrow: "Custom sounds",
        title: "Personalize reminders without tracking",
        sub: "Upload a short sound, schedule an exact time, and keep everything stored locally in Chrome.",
        points: ["MP3 and WAV custom sounds", "Specific time with daily repeat", "No tracking or remote account"],
        popup: `
          <h2>Airplane Chime Timer</h2>
          <div class="card">
            <span class="label">Custom Sound</span>
            <div class="upload">Add Custom Sound</div>
            <div class="choice">cabin-ding.wav</div>
          </div>
          <div class="card">
            <span class="label">Interval or Time</span>
            <div class="select">Specific time...</div>
            <div class="input">18:00</div>
            <div class="choice"><span><span class="radio"></span>Repeat daily</span></div>
          </div>
          <div class="card">
            <div class="row"><span>Timer Active</span><span class="toggle"></span></div>
            <div class="next">Next chime at: <strong>18:00</strong></div>
          </div>`
      }
    }[shot];

    document.getElementById("shot").innerHTML = `
      <section class="copy">
        <div class="eyebrow">✈ ${data.eyebrow}</div>
        <h1>${data.title}</h1>
        <p class="sub">${data.sub}</p>
        <div class="points">${data.points.map((point) => `<div class="point"><span class="check">✓</span><span>${point}</span></div>`).join("")}</div>
      </section>
      <section class="stage">
        <div class="browser">
          <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span>Airplane Chime Timer</div>
          <div class="mock-area"><div class="popup">${data.popup}</div></div>
        </div>
      </section>`;
  </script>
</body>
</html>
